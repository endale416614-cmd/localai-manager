# Example: the author's own list, with its apps under C:\LocalAI. An install does not use this file: the first
# start writes an apps.toml beside the exe with the apps it installs or finds (see README, "One-click install").
#
# LocalAI Manager app list. Launch settings live in the .bat files; this file only says how to run and watch them.
# group: "gpu" (only one at a time, 8 GB VRAM), "svc" (background service), "app" (desktop/terminal, launch only)
# health: HTTP path that returns 200 when ready, or "tcp" for "port accepts connections".
# needs_chat: id of a chat app to start with this one when no chat app is running. Never stops another app: when
#   another GPU app is on or stopping, or the chat port answers already, it is skipped (not queued) and the app's
#   log says why. Stopping this app leaves the chat app running.

[[app]]
id = "qwen36"
name = "Qwen3.6"
sub = "Qwen3.6 35B-A3B · UD-Q4_K_XL · chat"
group = "gpu"
chat = true
cmd = ["cmd.exe", "/c", "C:\\LocalAI\\start-qwen36.bat"]
cwd = "C:\\LocalAI"
port = 8084
health = "/health"
url = "http://127.0.0.1:8084"
note = "Thinks before it answers. Installed by LocalAI setup; flags live in start-qwen36.bat."

[[app]]
id = "coder"
