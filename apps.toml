[[app]]
id = "odysseus"
name = "Odysseus"
sub = "AI workspace · chat, agents, research, docs"
group = "svc"
needs_chat = "qwen36"
cmd = ["C:\\Odysseus\\venv\\Scripts\\python.exe", "-m", "uvicorn", "app:app", "--host", "127.0.0.1", "--port", "7000"]
cwd = "C:\\Odysseus"
port = 7000
health = "/api/health"
url = "http://127.0.0.1:7000"
note = "Point it at a chat model (e.g. Qwen3.6 on :8084) in odysseus\\.env. Run setup.py once first to create the admin login."

